services:
  postgres:
    image: postgres:15-alpine
    container_name: sifos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sifos
      POSTGRES_PASSWORD: sifos
      POSTGRES_DB: sifos
    ports:
      - "5432:5432"
    volumes:
      - sifos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifos -d sifos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sifos_pg_data:
